<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4枠 人数カウント (ローカルストレージ保存)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --btn-plus: #22c55e;
            --btn-plus-hover: #16a34a;
            --btn-minus: #ef4444;
            --btn-minus-hover: #dc2626;
            --btn-reset: #64748b;
            --btn-reset-hover: #475569;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1000px;
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--accent-color);
        }

        .total-banner {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15);
        }

        .total-label {
            font-size: 1.2rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .total-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .header-actions {
            display: flex;
            gap: 0.5rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1000px;
        }

        .counter-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, border-color 0.2s;
        }

        .counter-card:hover {
            border-color: var(--accent-color);
        }

        .title-input {
            width: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            padding: 0.6rem 0.8rem;
            margin-bottom: 1rem;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .title-input:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: #0f172a;
        }

        .count-display {
            font-size: 3.5rem;
            font-weight: 800;
            color: #ffffff;
            margin: 0.5rem 0 1.2rem 0;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            width: 100%;
        }

        .btn {
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 0.8rem 0;
            cursor: pointer;
            color: #ffffff;
            transition: background-color 0.15s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-plus {
            background-color: var(--btn-plus);
            grid-column: span 2;
            font-size: 1.4rem;
            padding: 1rem 0;
        }

        .btn-plus:hover {
            background-color: var(--btn-plus-hover);
        }

        .btn-plus-5 {
            background-color: #0284c7;
        }

        .btn-plus-5:hover {
            background-color: #0369a1;
        }

        .btn-minus {
            background-color: var(--btn-minus);
        }

        .btn-minus:hover {
            background-color: var(--btn-minus-hover);
        }

        .btn-reset {
            background-color: var(--btn-reset);
            width: 100%;
            margin-top: 0.6rem;
            font-size: 0.95rem;
            padding: 0.5rem 0;
        }

        .btn-reset:hover {
            background-color: var(--btn-reset-hover);
        }

        .btn-header-reset {
            background-color: var(--btn-reset);
            color: #fff;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-header-reset:hover {
            background-color: var(--btn-reset-hover);
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }
            .grid-container {
                grid-template-columns: 1fr;
            }
            .total-banner {
                flex-direction: column;
                gap: 0.5rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>4枠 人数カウンター</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">タイトルを自由に編集して同時に4つまで人数を数えられます</p>

        <div class="total-banner">
            <div>
                <span class="total-label">合計人数: </span>
                <span class="total-value" id="totalCount">0</span> 人
            </div>
            <div class="header-actions">
                <button class="btn-header-reset" onclick="resetAll()">全リセット</button>
            </div>
        </div>
    </header>

    <main class="grid-container" id="counterContainer">
        <!-- 4 Counter slots will be generated by JavaScript -->
    </main>

    <script>
        const STORAGE_KEY = 'multi_people_counter_v1';

        const defaultData = [
            { id: 1, title: 'タイトル 1', count: 0 },
            { id: 2, title: 'タイトル 2', count: 0 },
            { id: 3, title: 'タイトル 3', count: 0 },
            { id: 4, title: 'タイトル 4', count: 0 }
        ];

        let counters = loadCounters();

        function loadCounters() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    const parsed = JSON.parse(data);
                    if (Array.isArray(parsed) && parsed.length === 4) {
                        return parsed;
                    }
                }
            } catch (e) {
                console.error("Failed to load from localStorage", e);
            }
            return defaultData;
        }

        function saveCounters() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(counters));
            } catch (e) {
                console.error("Failed to save to localStorage", e);
            }
        }

        function render() {
            const container = document.getElementById('counterContainer');
            container.innerHTML = '';

            let total = 0;

            counters.forEach((c, index) => {
                total += c.count;

                const card = document.createElement('div');
                card.className = 'counter-card';
                card.innerHTML = `
                    <input type="text"
                           class="title-input"
                           value="${escapeHtml(c.title)}"
                           placeholder="タイトルを入力"
                           onchange="updateTitle(${index}, this.value)">
                    <div class="count-display" id="count-display-${index}">${c.count}</div>
                    <div class="btn-grid">
                        <button class="btn btn-plus" onclick="changeCount(${index}, 1)">+1</button>
                        <button class="btn btn-minus" onclick="changeCount(${index}, -1)">-1</button>
                        <button class="btn btn-plus-5" onclick="changeCount(${index}, 5)">+5</button>
                    </div>
                    <button class="btn btn-reset" onclick="resetCounter(${index})">リセット</button>
                `;
                container.appendChild(card);
            });

            document.getElementById('totalCount').innerText = total;
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function updateTitle(index, newTitle) {
            counters[index].title = newTitle;
            saveCounters();
        }

        function changeCount(index, delta) {
            counters[index].count = Math.max(0, counters[index].count + delta);
            saveCounters();
            render();
        }

        function resetCounter(index) {
            counters[index].count = 0;
            saveCounters();
            render();
        }

        function resetAll() {
            if (confirm('すべてのカウンターをリセットしますか？')) {
                counters.forEach(c => c.count = 0);
                saveCounters();
                render();
            }
        }

        // Initial render on page load
        document.addEventListener('DOMContentLoaded', () => {
            render();
        });
    </script>
</body>
</html>
