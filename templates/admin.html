<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>親機監視ダッシュボード - 萌え萌えカフェ カウンターモニター</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <!-- Socket.IO CDN -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        :root {
            --bg-bright: #fff5f8;
            --main-pink: #ff66aa;
            --hot-pink: #ff1a75;
            --soft-pastel: #ffe6f0;
            --cyber-green: #00cc44;
            --cyber-red: #ff0044;
            --border-pink: #ffb3d9;
            --text-dark: #4a2c3a;
            --font-mono: 'Share Tech Mono', monospace;
            --font-kawaii: 'Zen Maru Gothic', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-bright);
            color: var(--text-dark);
            font-family: var(--font-kawaii);
            min-height: 100vh;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(255, 182, 193, 0.15) 50%,
                rgba(255, 182, 193, 0.15)
            );
            background-size: 100% 4px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px dashed var(--main-pink);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--hot-pink);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-weight: 900;
        }

        .header-controls {
            display: flex;
            gap: 0.8rem;
        }

        .btn-moe-admin {
            background: linear-gradient(135deg, var(--main-pink), var(--hot-pink));
            border: 2px solid #ffffff;
            color: #fff;
            padding: 0.65rem 1.2rem;
            font-family: var(--font-kawaii);
            font-size: 0.95rem;
            font-weight: 900;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(255, 26, 117, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-moe-admin:hover {
            background: linear-gradient(135deg, var(--hot-pink), var(--main-pink));
            box-shadow: 0 6px 18px rgba(255, 26, 117, 0.5);
            transform: scale(1.05);
        }

        .btn-moe-danger {
            background: linear-gradient(135deg, #ff0044, #990026);
        }

        .btn-moe-camera {
            background: linear-gradient(135deg, #00b33c, #006622);
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .room-card {
            background: #ffffff;
            border: 3px solid var(--border-pink);
            padding: 1.3rem;
            border-radius: 20px;
            position: relative;
            box-shadow: 0 6px 20px rgba(255, 102, 170, 0.2);
            transition: all 0.3s;
        }

        .room-card.status-playing {
            border-color: var(--hot-pink);
            box-shadow: 0 8px 25px rgba(255, 26, 117, 0.35);
        }

        .room-card.status-finished {
            border-color: var(--cyber-red);
            box-shadow: 0 8px 25px rgba(255, 0, 68, 0.35);
        }

        .room-title {
            font-size: 1.3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed var(--border-pink);
            padding-bottom: 0.5rem;
            margin-bottom: 0.8rem;
            color: var(--hot-pink);
            font-weight: 900;
        }

        .status-pill {
            font-size: 0.85rem;
            padding: 0.25rem 0.8rem;
            border-radius: 15px;
            font-weight: 900;
        }

        .pill-waiting { background: #ffe6f0; color: var(--hot-pink); border: 2px solid var(--border-pink); }
        .pill-playing { background: var(--hot-pink); color: #fff; }
        .pill-finished { background: var(--cyber-red); color: #fff; }

        .video-box {
            width: 100%;
            height: 180px;
            background: #000;
            border: 2px solid var(--main-pink);
            border-radius: 12px;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .video-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-off-placeholder {
            color: #ff99cc;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .client-info-list {
            min-height: 100px;
            margin-bottom: 1rem;
        }

        .client-item {
            background: #fff0f5;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            border-left: 5px solid var(--main-pink);
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .client-item.cleared { border-left-color: var(--cyber-green); }
        .client-item.gameover { border-left-color: var(--cyber-red); }

        .stat-line {
            display: flex;
            justify-content: space-between;
            margin-top: 0.3rem;
        }

        .room-timer {
            font-family: var(--font-mono);
            font-size: 1.7rem;
            text-align: center;
            margin: 0.8rem 0;
            background: #fff8fa;
            padding: 0.4rem;
            border: 2px solid var(--main-pink);
            border-radius: 14px;
            color: var(--hot-pink);
            font-weight: bold;
        }

        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .action-row {
            display: flex;
            gap: 0.5rem;
        }

        .action-row button {
            flex: 1;
            font-size: 0.85rem;
            padding: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="scanline"></div>

    <header>
        <h1><span>🎀 ☕ 💖</span> 萌え萌えメイドカフェ - カウンターモニター</h1>
        <div class="header-controls">
            <button class="btn-moe-admin btn-moe-camera" id="btnToggleCameraAll">📷 カメラ一括ON/OFF</button>
            <button class="btn-moe-admin" id="btnStartAll">⚡ 一括スタート (10部屋)</button>
            <button class="btn-moe-admin btn-moe-danger" id="btnResetAll">⚠️ 一括強制リセット</button>
        </div>
    </header>

    <div class="rooms-grid" id="roomsGrid">
        <!-- 10 Room cards auto generated -->
    </div>

    <script>
        const socket = io();
        let roomsData = {};
        let allCameraEnabled = false;

        socket.on('connect', () => {
            console.log("Connected to Admin SocketIO Server. SID:", socket.id);
        });

        socket.on('admin_state_update', (data) => {
            roomsData = data;
            renderGrid();
        });

        socket.on('admin_camera_stream', (data) => {
            const roomId = data.room_id;
            const imgEl = document.getElementById(`camera_feed_${roomId}`);
            if (imgEl) {
                imgEl.src = data.frame;
                imgEl.style.display = 'block';
                const placeholder = document.getElementById(`camera_off_${roomId}`);
                if (placeholder) placeholder.style.display = 'none';
            }
        });

        function renderGrid() {
            const grid = document.getElementById('roomsGrid');
            grid.innerHTML = '';

            for (let i = 1; i <= 10; i++) {
                const roomId = `Room_${i}`;
                const room = roomsData[roomId] || {
                    room_id: roomId,
                    status: 'waiting',
                    start_time: null,
                    duration: 180,
                    escape_code: '------',
                    camera_enabled: false,
                    clients: {}
                };

                const card = document.createElement('div');
                card.className = `room-card status-${room.status}`;

                let statusPillClass = 'pill-waiting';
                if (room.status === 'playing') statusPillClass = 'pill-playing';
                if (room.status === 'finished') statusPillClass = 'pill-finished';

                let timerText = "03:00";
                if (room.status === 'playing' && room.start_time) {
                    const elapsed = (Date.now() / 1000) - room.start_time;
                    const rem = Math.max(0, Math.floor(room.duration - elapsed));
                    const mins = String(Math.floor(rem / 60)).padStart(2, '0');
                    const secs = String(rem % 60).padStart(2, '0');
                    timerText = `${mins}:${secs}`;
                }

                const clientsKeys = Object.keys(room.clients || {});
                let clientsHtml = '';

                if (clientsKeys.length === 0) {
                    clientsHtml = `<div style="color: #a06080; text-align: center; padding: 1.5rem 0; font-weight: bold;">( 未接続 )</div>`;
                } else {
                    clientsKeys.forEach(sid => {
                        const c = room.clients[sid];
                        clientsHtml += `
                            <div class="client-item ${c.status}">
                                <div style="display: flex; justify-content: space-between; font-weight: 900; color: var(--hot-pink);">
                                    <span>👤 ${c.device_name}</span>
                                    <span>${c.status.toUpperCase()}</span>
                                </div>
                                <div class="stat-line">
                                    <span>現在問題: Q.${c.current_q} / 10</span>
                                    <span>お仕置き: ${c.continues}回</span>
                                </div>
                                ${c.title ? `<div style="color: var(--hot-pink); font-size: 0.8rem; margin-top: 0.3rem;">称号: ${c.title}</div>` : ''}
                            </div>
                        `;
                    });
                }

                card.innerHTML = `
                    <div class="room-title">
                        <span>🎀 ${roomId}</span>
                        <span class="status-pill ${statusPillClass}">${room.status}</span>
                    </div>

                    <div class="video-box">
                        <img id="camera_feed_${roomId}" style="display: ${room.camera_enabled ? 'block' : 'none'};" alt="Live Stream">
                        <div class="camera-off-placeholder" id="camera_off_${roomId}" style="display: ${room.camera_enabled ? 'none' : 'flex'};">
                            <span>📹 カメラOFF</span>
                            <span style="font-size: 0.75rem; color: #cc88aa;">(通信軽量化中)</span>
                        </div>
                    </div>

                    <div class="room-timer" id="timer_${roomId}">${timerText}</div>

                    <div style="font-size: 0.85rem; color: var(--hot-pink); margin-bottom: 0.6rem; font-family: var(--font-mono); font-weight: bold;">
                        脱出コード: <span style="color: var(--cyber-green); font-weight: bold;">${room.escape_code}</span>
                    </div>

                    <div class="client-info-list">
                        ${clientsHtml}
                    </div>

                    <div class="card-actions">
                        <button class="btn-moe-admin btn-moe-camera" onclick="toggleCamera('${roomId}', ${!room.camera_enabled})" style="width: 100%;">
                            ${room.camera_enabled ? '📷 カメラ切断 (軽量化)' : '📷 遠隔カメラ起動 (LIVE)'}
                        </button>
                        <div class="action-row">
                            <button class="btn-moe-admin" onclick="startRoom('${roomId}')" ${room.status === 'playing' ? 'disabled' : ''}>スタート</button>
                            <button class="btn-moe-admin btn-moe-danger" onclick="resetRoom('${roomId}')">強制リセット</button>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            }
        }

        function toggleCamera(roomId, enable) {
            socket.emit('admin_toggle_camera', {
                room_id: roomId,
                enabled: enable
            });
        }

        function startRoom(roomId) {
            socket.emit('admin_start_room', { room_id: roomId });
        }

        function resetRoom(roomId) {
            if (confirm(`${roomId} を初期状態にリセットしますか？`)) {
                socket.emit('admin_reset_room', { room_id: roomId });
            }
        }

        document.getElementById('btnToggleCameraAll').onclick = () => {
            allCameraEnabled = !allCameraEnabled;
            socket.emit('admin_toggle_camera', {
                room_id: 'ALL',
                enabled: allCameraEnabled
            });
        };

        document.getElementById('btnStartAll').onclick = () => {
            if (confirm('全10部屋を一括スタートしますか？')) {
                socket.emit('admin_start_all');
            }
        };

        document.getElementById('btnResetAll').onclick = () => {
            if (confirm('全10部屋を一括強制リセットしますか？')) {
                socket.emit('admin_reset_all');
            }
        };

        setInterval(() => {
            if (roomsData) {
                for (let roomId in roomsData) {
                    const room = roomsData[roomId];
                    const timerEl = document.getElementById(`timer_${roomId}`);
                    if (timerEl && room.status === 'playing' && room.start_time) {
                        const elapsed = (Date.now() / 1000) - room.start_time;
                        const rem = Math.max(0, Math.floor(room.duration - elapsed));
                        const mins = String(Math.floor(rem / 60)).padStart(2, '0');
                        const secs = String(rem % 60).padStart(2, '0');
                        timerEl.innerText = `${mins}:${secs}`;
                    }
                }
            }
        }, 1000);
    </script>
</body>
</html>
